<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Professional Profile</title>
    <style>
        /* 전문가적이고 깔끔한 스타일링 */
        body {
            font-family: 'Pretendard', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
        }
        .profile-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #ddd;
            margin-bottom: 20px;
            object-fit: cover;
        }
        h1 { margin: 10px 0; font-size: 1.5rem; }
        p { color: #666; font-size: 0.95rem; margin-bottom: 25px; }
        
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .tag {
            background: #e7f3ff;
            color: #007bff;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        .links a {
            display: block;
            text-decoration: none;
            background: #333;
            color: white;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            transition: 0.3s;
        }
        .links a:hover {
            background: #555;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="profile-card">
    <div style="font-size: 50px; margin-bottom: 20px;">🏛️</div> 
    <h1>Professional Portfolio</h1>
    <p>시장과 공간, 그리고 영혼을 돌보는 전문가</p>
    
    <div class="tag-container">
        <span class="tag">#선물트레이더</span>
        <span class="tag">#인테리어전문가</span>
        <span class="tag">#목회자</span>
    </div>

    <div class="links">
        <a href="#">Trading Strategy</a>
        <a href="#">Interior Portfolio</a>
        <a href="#">Contact Me</a>
    </div>
</div>

</body>
</html>
